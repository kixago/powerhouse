# === GLOBAL BASELINE: Zen 3 / Rembrandt ===
COMMON_FLAGS="-march=znver3 -mtune=znver3 -O3 -pipe"
CFLAGS="${COMMON_FLAGS} -flto=thin"
CXXFLAGS="${COMMON_FLAGS} -flto=thin"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# === LLVM TOOLCHAIN (from features/llvm make.defaults) ===
CC="clang"
CXX="clang++"
LD="ld.lld"
AR="llvm-ar"
AS="clang -c"
CPP="clang-cpp"
NM="llvm-nm"
STRIP="llvm-strip"
RANLIB="llvm-ranlib"
OBJCOPY="llvm-objcopy"
STRINGS="llvm-strings"
OBJDUMP="llvm-objdump"
READELF="llvm-readelf"
ADDR2LINE="llvm-addr2line"

# Rust/libc++ integration
LLVM_USE_LIBCXX="1"
CXXSTDLIB="c++"

# === LINKER ===
LDFLAGS="-fuse-ld=lld -Wl,--as-needed \
  -Wl,--thinlto-cache-dir=/var/tmp/portage/thinlto_cache \
  -Wl,--thinlto-cache-policy=cache_size_bytes=5g"

# === LANGUAGE TARGETS ===
RUSTFLAGS="-C opt-level=3 -C target-cpu=znver3 -C lto=thin -C codegen-units=1"
GOAMD64="v3"

# === USE FLAGS ===
USE="wayland wlroots pipewire vulkan vaapi gles2 opengl \
     dbus policykit alsa udev zstd lz4 lm-sensors \
     -X -x11 -nvidia -kde -gnome -gtk2 -nls -wifi -telemetry -debug"

# === HARDWARE ===
ABI_X86="64"
LLVM_TARGETS="AMDGPU X86 WebAssembly AArch64 BPF"
VIDEO_CARDS="amdgpu radeonsi"
INPUT_DEVICES="libinput"

# === PARALLELISM ===
MAKEOPTS="-j16 -l17"
EMERGE_DEFAULT_OPTS="--jobs 4 --load-average 17 --with-bdeps=y \
  --verbose-conflicts"

# === SCHEDULING ===
PORTAGE_NICENESS="10"
PORTAGE_IONICE_COMMAND="ionice -c 2 -n 0 -p \${PID}"
PORTAGE_TMPDIR="/var/tmp/portage"

# === PORTAGE ===
ACCEPT_KEYWORDS="~amd64"
ACCEPT_LICENSE="*"
FEATURES="parallel-fetch parallel-install candy binpkg-docompress"
L10N="en en-US he"
LC_MESSAGES=C.UTF-8
